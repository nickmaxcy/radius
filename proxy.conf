
proxy server {
        default_fallback = no
}

## eduroam config
home_server eduroam_flr_server_1 {
        type = auth
        ipaddr = tlrs1.eduroam.us
        secret = 
        port = 1812
}

home_server eduroam_flr_server_2 {
        type = auth
        ipaddr = tlrs2.eduroam.us
        secret = 
        port = 1812
}

home_server_pool EDUROAM {
        type = fail-over
        home_server = eduroam_flr_server_1
        home_server = eduroam_flr_server_2
}

## for users with no realm - like "testuser", not "testuers@example.com"
realm NULL {
}
realm LOCAL {
}

## send your realm to the local server
realm .org {
        authhost = LOCAL
        accthost = LOCAL
}

## setup eduroam as default realm
realm DEFAULT {
        auth_pool = EDUROAM
        accthost = LOCAL
        nostrip
}
